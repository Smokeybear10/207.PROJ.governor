name: VS Code Extension

on:
  push:
    branches:
      - main
    tags:
      - "vscode-v*"
    paths:
      - "vscode-extension/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "vscode-extension/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/extension.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Verify bundled backend
        run: npm run check

      - name: Audit backend dependencies
        run: npm audit

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Type check extension
        working-directory: vscode-extension
        run: npm run typecheck

      - name: Unit test extension
        working-directory: vscode-extension
        run: npm test

      - name: VS Code integration tests
        working-directory: vscode-extension
        run: npm run test:vscode

      - name: Package VSIX
        working-directory: vscode-extension
        run: npm run package

      - name: Audit extension dependencies
        working-directory: vscode-extension
        run: npm audit

      - name: Upload tested VSIX
        uses: actions/upload-artifact@v4
        with:
          name: token-governor-vscode
          path: vscode-extension/token-governor-vscode.vsix

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/vscode-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag matches manifest
        run: test "$GITHUB_REF_NAME" = "vscode-v$(node -p "require('./package.json').version")"

      - name: Require Marketplace credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: test -n "$VSCE_PAT"

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PUBLISH_REAL: "true"
        run: npm run publish:mock

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: token-governor-vscode-release
          path: |
            vscode-extension/token-governor-vscode.vsix
