name: VS Code Extension

on:
  push:
    paths:
      - "vscode-extension/**"
      - ".github/workflows/extension.yml"
  pull_request:
    paths:
      - "vscode-extension/**"
      - ".github/workflows/extension.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # Install a virtual framebuffer so the headless runner can launch the
      # VS Code Electron test host, then run the integration test suite.
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: VS Code integration tests
        run: xvfb-run -a npm run test:vscode

  # On every push to main, once tests pass, (mock) publish the extension.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Publishes for real when a `VSCE_PAT` repository secret is present,
      # otherwise falls back to a no-secret mock deploy. The publish:mock
      # script does a real `vsce publish` only when PUBLISH_REAL=true AND
      # VSCE_PAT is set. NOTE: the Marketplace rejects a duplicate version,
      # so bump `version` in vscode-extension/package.json to ship an update.
      - name: Publish to Marketplace (real if VSCE_PAT set, else mock)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          PUBLISH_REAL: ${{ secrets.VSCE_PAT != '' && 'true' || 'false' }}
        run: npm run publish:mock

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: token-governor-vscode
          path: |
            vscode-extension/token-governor-vscode.vsix
            vscode-extension/dist/mock-marketplace-receipt.json
