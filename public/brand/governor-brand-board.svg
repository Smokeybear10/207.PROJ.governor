<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240">
  <title>Governor logo and interface direction board</title>
  <rect width="1600" height="1240" fill="#F2F5F3" />

  <text x="70" y="86" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="760">
    Governor
  </text>
  <text x="70" y="128" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="20">
    Brand directions for a budget-aware AI execution control plane
  </text>
  <text x="70" y="171" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">
    PRINCIPLE
  </text>
  <text x="170" y="171" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="15">
    Control, admission, and accountability without security, government, token, or crypto cliches.
  </text>

  <!-- Concept 01 -->
  <g transform="translate(70 215)">
    <rect width="470" height="320" rx="8" fill="#FFFFFF" stroke="#9AB9AC" stroke-width="2" />
    <text x="24" y="34" fill="#13825D" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">01 / RECOMMENDED</text>
    <text x="24" y="66" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="740">Aperture G</text>
    <rect x="24" y="89" width="116" height="116" rx="12" fill="#14231F" />
    <path d="M102 116A32 32 0 1 0 102 178" fill="none" stroke="#F7FAF8" stroke-width="12" stroke-linecap="round" />
    <path d="M84 147H110V176" fill="none" stroke="#F7FAF8" stroke-width="12" stroke-linejoin="round" />
    <path d="M110 122V134" fill="none" stroke="#43D5A0" stroke-width="7" stroke-linecap="round" />
    <text x="164" y="139" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760">Governor</text>
    <text x="164" y="170" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Execution control plane</text>
    <line x1="24" y1="229" x2="446" y2="229" stroke="#DCE3E0" />
    <text x="24" y="258" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Meaning</text>
    <text x="24" y="283" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">A G whose terminal becomes an admission gate.</text>
    <text x="24" y="305" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Ownable at favicon size; calm and infrastructure-led.</text>
  </g>

  <!-- Concept 02 -->
  <g transform="translate(565 215)">
    <rect width="470" height="320" rx="8" fill="#FFFFFF" stroke="#D8E0DC" />
    <text x="24" y="34" fill="#72807B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">02 / BOUNDARY</text>
    <text x="24" y="66" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="740">Guardrails</text>
    <rect x="24" y="89" width="116" height="116" rx="12" fill="#E8F3EE" />
    <path d="M67 111H53V183H67M97 111H111V183H97" fill="none" stroke="#14231F" stroke-width="9" stroke-linecap="square" stroke-linejoin="round" />
    <path d="M71 147H99" fill="none" stroke="#14231F" stroke-width="9" stroke-linecap="round" />
    <path d="M89 136L100 147L89 158" fill="none" stroke="#18A875" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <text x="164" y="139" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760">Governor</text>
    <text x="164" y="170" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Stay inside policy</text>
    <line x1="24" y1="229" x2="446" y2="229" stroke="#DCE3E0" />
    <text x="24" y="258" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Meaning</text>
    <text x="24" y="283" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">A request passes through an explicit policy boundary.</text>
    <text x="24" y="305" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Most literal product story; less distinctive as a mark.</text>
  </g>

  <!-- Concept 03 -->
  <g transform="translate(1060 215)">
    <rect width="470" height="320" rx="8" fill="#FFFFFF" stroke="#D8E0DC" />
    <text x="24" y="34" fill="#72807B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">03 / ALLOCATION</text>
    <text x="24" y="66" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="740">Reserve Ring</text>
    <rect x="24" y="89" width="116" height="116" rx="12" fill="#EEF1F7" />
    <circle cx="82" cy="147" r="35" fill="none" stroke="#C9D3CF" stroke-width="13" />
    <circle cx="82" cy="147" r="35" fill="none" stroke="#14231F" stroke-width="13" stroke-linecap="round" stroke-dasharray="132 88" transform="rotate(-88 82 147)" />
    <circle cx="82" cy="147" r="35" fill="none" stroke="#3F6FA8" stroke-width="13" stroke-linecap="round" stroke-dasharray="41 179" stroke-dashoffset="-141" transform="rotate(-88 82 147)" />
    <path d="M82 133V148L93 155" fill="none" stroke="#14231F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <text x="164" y="139" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760">Governor</text>
    <text x="164" y="170" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Spend with a reserve</text>
    <line x1="24" y1="229" x2="446" y2="229" stroke="#DCE3E0" />
    <text x="24" y="258" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Meaning</text>
    <text x="24" y="283" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Settled, reserved, and available budget in one loop.</text>
    <text x="24" y="305" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Best product metaphor; risks reading as analytics.</text>
  </g>

  <!-- Concept 04 -->
  <g transform="translate(70 565)">
    <rect width="470" height="320" rx="8" fill="#FFFFFF" stroke="#D8E0DC" />
    <text x="24" y="34" fill="#72807B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">04 / WORKFLOW</text>
    <text x="24" y="66" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="740">Checkpoint</text>
    <rect x="24" y="89" width="116" height="116" rx="12" fill="#FFF2D9" />
    <path d="M47 178H69V158H91V138H115" fill="none" stroke="#14231F" stroke-width="9" stroke-linejoin="round" />
    <rect x="41" y="172" width="12" height="12" rx="2" fill="#E29A24" />
    <rect x="63" y="152" width="12" height="12" rx="2" fill="#14231F" />
    <rect x="85" y="132" width="12" height="12" rx="2" fill="#14231F" />
    <path d="M116 124V151" fill="none" stroke="#E29A24" stroke-width="8" stroke-linecap="round" />
    <text x="164" y="139" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760">Governor</text>
    <text x="164" y="170" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Control every step</text>
    <line x1="24" y1="229" x2="446" y2="229" stroke="#DCE3E0" />
    <text x="24" y="258" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Meaning</text>
    <text x="24" y="283" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">A multi-step run advances through enforced checkpoints.</text>
    <text x="24" y="305" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Strong for workflow UI; weaker as a universal symbol.</text>
  </g>

  <!-- Concept 05 -->
  <g transform="translate(565 565)">
    <rect width="470" height="320" rx="8" fill="#FFFFFF" stroke="#D8E0DC" />
    <text x="24" y="34" fill="#72807B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">05 / ACCOUNTING</text>
    <text x="24" y="66" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="740">Ledger G</text>
    <rect x="24" y="89" width="116" height="116" rx="12" fill="#E8F3EE" />
    <path d="M108 119A38 38 0 1 0 108 175" fill="none" stroke="#14231F" stroke-width="9" stroke-linecap="round" />
    <path d="M68 132H111M68 147H104M68 162H112" fill="none" stroke="#14231F" stroke-width="7" stroke-linecap="round" />
    <path d="M111 155V176" fill="none" stroke="#18A875" stroke-width="8" stroke-linecap="round" />
    <text x="164" y="139" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760">Governor</text>
    <text x="164" y="170" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Every dollar accounted for</text>
    <line x1="24" y1="229" x2="446" y2="229" stroke="#DCE3E0" />
    <text x="24" y="258" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Meaning</text>
    <text x="24" y="283" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">The monogram contains an auditable execution ledger.</text>
    <text x="24" y="305" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Credible and technical; detail drops at small sizes.</text>
  </g>

  <!-- Concept 06 -->
  <g transform="translate(1060 565)">
    <rect width="470" height="320" rx="8" fill="#FFFFFF" stroke="#D8E0DC" />
    <text x="24" y="34" fill="#72807B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">06 / HARD CAP</text>
    <text x="24" y="66" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="740">Threshold</text>
    <rect x="24" y="89" width="116" height="116" rx="12" fill="#FCEBE8" />
    <path d="M45 119H119" fill="none" stroke="#C64A3A" stroke-width="8" stroke-linecap="round" />
    <path d="M53 181V161M73 181V149M93 181V137M113 181V119" fill="none" stroke="#14231F" stroke-width="9" />
    <path d="M45 188H121" fill="none" stroke="#14231F" stroke-width="6" stroke-linecap="round" />
    <text x="164" y="139" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="760">Governor</text>
    <text x="164" y="170" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Know the limit before dispatch</text>
    <line x1="24" y1="229" x2="446" y2="229" stroke="#DCE3E0" />
    <text x="24" y="258" fill="#14231F" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Meaning</text>
    <text x="24" y="283" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Spend rises toward a visible, immovable ceiling.</text>
    <text x="24" y="305" fill="#60706A" font-family="Inter, Arial, sans-serif" font-size="14">Clear hard-cap story; reads more like a chart icon.</text>
  </g>

  <!-- Recommended interface system -->
  <g transform="translate(70 930)">
    <rect width="1460" height="245" rx="8" fill="#14231F" />
    <text x="28" y="42" fill="#43D5A0" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800">RECOMMENDED INTERFACE SYSTEM</text>
    <text x="28" y="79" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="740">Quiet control room, visible financial boundaries</text>

    <text x="28" y="122" fill="#9BA9A4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">PALETTE</text>
    <rect x="28" y="139" width="38" height="38" rx="5" fill="#F2F5F3" />
    <rect x="76" y="139" width="38" height="38" rx="5" fill="#FFFFFF" />
    <rect x="124" y="139" width="38" height="38" rx="5" fill="#14231F" stroke="#42514C" />
    <rect x="172" y="139" width="38" height="38" rx="5" fill="#18A875" />
    <rect x="220" y="139" width="38" height="38" rx="5" fill="#3F6FA8" />
    <rect x="268" y="139" width="38" height="38" rx="5" fill="#E29A24" />
    <rect x="316" y="139" width="38" height="38" rx="5" fill="#C64A3A" />
    <text x="28" y="202" fill="#9BA9A4" font-family="Inter, Arial, sans-serif" font-size="12">Neutral canvas, ink, admission green, data blue, reserve amber, stop red</text>

    <text x="510" y="122" fill="#9BA9A4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">TYPE</text>
    <text x="510" y="158" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="740">Governor</text>
    <text x="510" y="183" fill="#9BA9A4" font-family="SFMono-Regular, Consolas, monospace" font-size="13">run_01J9 / $0.075000 / ADMITTED</text>
    <text x="510" y="208" fill="#9BA9A4" font-family="Inter, Arial, sans-serif" font-size="12">Sans for decisions; mono only for IDs and exact amounts</text>

    <text x="950" y="122" fill="#9BA9A4" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">UI CHARACTER</text>
    <text x="950" y="151" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15">Dense, scan-first operations layout</text>
    <text x="950" y="179" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15">Color reserved for state and accounting</text>
    <text x="950" y="207" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="15">No decorative shields, coins, crowns, or gradients</text>
  </g>

  <text x="70" y="1214" fill="#72807B" font-family="Inter, Arial, sans-serif" font-size="13">
    Direction board v1 / Use Aperture G for the current product pass; validate name and trademark before external launch.
  </text>
</svg>
